# Server Configuration
spring.application.name=customer-service
server.port=${SERVER_PORT:8081}
server.servlet.context-path=/pos-system

# Profile Configuration
# Set POS_PROFILE=dev|qa|staging|prod to switch environments quickly for demos.
spring.profiles.active=${POS_PROFILE:dev}
app.demo.environment=default

# Service Discovery
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# Database Configuration
# Defaults to an in-memory H2 database so the app can boot and test without a local Postgres instance.
# Set POS_DB_URL / POS_DB_USER / POS_DB_PASSWORD / POS_DB_DRIVER / POS_DB_DIALECT to override with your PostgreSQL settings.
spring.datasource.url=${POS_DB_URL:jdbc:h2:mem:pos_customer;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${POS_DB_USER:sa}
spring.datasource.password=${POS_DB_PASSWORD:}
spring.datasource.driver-class-name=${POS_DB_DRIVER:org.h2.Driver}

# Hibernate Configuration
spring.jpa.database-platform=${POS_DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# Logging Configuration
logging.level.root=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# OpenAPI / Swagger Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.enable-hateoas=false

# Demo store settings (pos.* properties)
spring.config.import=optional:classpath:pos-config.yml

# Resilience4j - reactive circuit breaker around the order-stats WebClient call
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=10s
resilience4j.timelimiter.configs.default.timeout-duration=3s

# Observability - Micrometer Tracing (Brave) exported to Zipkin; trace ids go into every log line
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:1.0}
management.tracing.export.zipkin.endpoint=${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
management.endpoints.web.exposure.include=health,info
# Logstash TCP destination, used only when the 'elk' profile is active (see logback-spring.xml)
pos.logstash.destination=${LOGSTASH_DESTINATION:localhost:5000}
# Carry the trace context across Reactor (WebClient) thread hops
spring.reactor.context-propagation=auto
