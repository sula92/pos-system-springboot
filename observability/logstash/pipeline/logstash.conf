# Receives JSON log events from the services' LogstashTcpSocketAppender (one JSON document per line)
# and writes them to one daily index per service, for example pos-order-service-2026.10.22.
input {
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  if ![app] {
    mutate { add_field => { "app" => "unknown" } }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "pos-%{[app]}-%{+YYYY.MM.dd}"
  }
}
