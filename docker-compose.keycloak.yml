# Local development Keycloak for the POS API. Not for production use.
# Start: docker compose -f docker-compose.keycloak.yml up -d
# Admin console: http://localhost:8180 (credentials from KEYCLOAK_ADMIN / KEYCLOAK_ADMIN_PASSWORD)
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
