# Server Configuration
spring.application.name=order-service
server.port=${SERVER_PORT:8083}
server.servlet.context-path=/pos-system

# Service Discovery
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# Database Configuration
# Defaults to an in-memory H2 database so the app can boot and test without a local Postgres instance.
# Set POS_DB_URL / POS_DB_USER / POS_DB_PASSWORD / POS_DB_DRIVER / POS_DB_DIALECT to override with your PostgreSQL settings.
spring.datasource.url=${POS_DB_URL:jdbc:h2:mem:pos_order;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${POS_DB_USER:sa}
spring.datasource.password=${POS_DB_PASSWORD:}
spring.datasource.driver-class-name=${POS_DB_DRIVER:org.h2.Driver}

# Hibernate Configuration
spring.jpa.database-platform=${POS_DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# Logging Configuration
logging.level.root=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# OpenAPI / Swagger Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.enable-hateoas=false

# OpenFeign - service-to-service calls with Resilience4j circuit breakers and fallbacks
spring.cloud.openfeign.circuitbreaker.enabled=true
spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=5000

# Resilience4j - business errors (404/409/400) must not open the circuit
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.configs.default.ignore-exceptions[0]=com.idet.pos.exception.ResourceNotFoundException
resilience4j.circuitbreaker.configs.default.ignore-exceptions[1]=com.idet.pos.exception.InsufficientStockException
resilience4j.circuitbreaker.configs.default.ignore-exceptions[2]=com.idet.pos.exception.InvalidRequestException
resilience4j.timelimiter.configs.default.timeout-duration=6s
