# Server Configuration
server.port=8080
server.servlet.context-path=/pos-system

# Database Configuration
# Defaults to an in-memory H2 database so the app can boot and test without a local Postgres instance.
# Set POS_DB_URL / POS_DB_USER / POS_DB_PASSWORD / POS_DB_DRIVER / POS_DB_DIALECT to override with your PostgreSQL settings.
spring.datasource.url=${POS_DB_URL:jdbc:h2:mem:pos_system;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${POS_DB_USER:sa}
spring.datasource.password=${POS_DB_PASSWORD:}
spring.datasource.driver-class-name=${POS_DB_DRIVER:org.h2.Driver}

# Hibernate Configuration
spring.jpa.database-platform=${POS_DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# Logging Configuration
logging.level.root=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Security - Keycloak as the OAuth2/OIDC provider (this app is a JWT resource server)
# KEYCLOAK_ISSUER_URI must match the "iss" claim of the tokens, e.g. http://localhost:8180/realms/pos
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/pos}
# Client whose client roles (resource_access.<client>.roles) are also mapped; realm roles are always mapped
pos.security.keycloak.client-id=${KEYCLOAK_CLIENT_ID:pos-frontend}
# Comma-separated list of browser origins allowed to call the API
pos.security.cors.allowed-origins=${POS_CORS_ALLOWED_ORIGINS:http://localhost:5173}

