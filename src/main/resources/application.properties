# Server Configuration
server.port=8080
server.servlet.context-path=/pos-system

# Profile Configuration
# Set POS_PROFILE=dev|qa|staging|prod to switch environments quickly for demos.
spring.profiles.active=${POS_PROFILE:dev}
app.demo.environment=default

# Database Configuration
# Defaults to an in-memory H2 database so the app can boot and test without a local Postgres instance.
# Set POS_DB_URL / POS_DB_USER / POS_DB_PASSWORD / POS_DB_DRIVER / POS_DB_DIALECT to override with your PostgreSQL settings.
spring.datasource.url=${POS_DB_URL:jdbc:h2:mem:pos_system;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${POS_DB_USER:sa}
spring.datasource.password=${POS_DB_PASSWORD:}
spring.datasource.driver-class-name=${POS_DB_DRIVER:org.h2.Driver}

# Hibernate Configuration
spring.jpa.database-platform=${POS_DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
# Fail fast instead of paginating in memory if a collection fetch is ever combined with a Pageable (HHH90003004).
spring.jpa.properties.hibernate.query.fail_on_pagination_over_collection_fetch=true

# Pagination defaults for list endpoints (page is 0-based; larger sizes are capped at the max)
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# Spring Batch
# Jobs never run on startup; they are started through the /batch endpoints.
spring.batch.job.enabled=false
# Create the BATCH_* job repository tables on every database, not only embedded ones.
spring.batch.jdbc.initialize-schema=always

# CSV upload limits for the batch import endpoints
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# Logging Configuration
logging.level.root=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# OpenAPI / Swagger Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.enable-hateoas=false

