server:
  port: 8080

spring:
  application:
    name: api-gateway
  reactor:
    # Carry the trace context across Reactor thread hops
    context-propagation: auto
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: customer-service
              uri: lb://customer-service
              predicates:
                - Path=/pos-system/customer/**,/pos-system/demo/**,/pos-system/api/config/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: customerService
                    fallbackUri: forward:/fallback/customer-service
            - id: item-service-internal-block
              uri: no://op
              order: -1
              predicates:
                - Path=/pos-system/inventory/internal/**
              filters:
                - SetStatus=404
            - id: item-service
              uri: lb://item-service
              predicates:
                - Path=/pos-system/item/**,/pos-system/inventory/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: itemService
                    fallbackUri: forward:/fallback/item-service
            - id: order-service-internal-block
              uri: no://op
              order: -1
              predicates:
                - Path=/pos-system/order/internal/**
              filters:
                - SetStatus=404
            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/pos-system/order/**,/pos-system/order-detail/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: orderService
                    fallbackUri: forward:/fallback/order-service

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
  timelimiter:
    configs:
      default:
        timeout-duration: 5s

# Observability - Micrometer Tracing (Brave) exported to Zipkin; trace ids go into every log line
management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      zipkin:
        endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
  endpoints:
    web:
      exposure:
        include: health,info

# Logstash TCP destination, used only when the 'elk' profile is active (see logback-spring.xml)
pos:
  logstash:
    destination: ${LOGSTASH_DESTINATION:localhost:5000}
